name: Idrometria Brenta

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      prova:
        description: 'Invia un messaggio Telegram di PROVA (nessuna allerta reale)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: idrometria
  cancel-in-progress: false

jobs:
  idro:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Recupera lo stato precedente
        run: |
          mkdir -p out
          git fetch --depth=1 origin data || true
          git show origin/data:state.json > out/state.json 2>/dev/null || echo '{}' > out/state.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Strumento per leggere il bollettino PDF
        run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Scarica dati ARPAV e invia gli avvisi
        run: node scripts/idro.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGGIO: ${{ inputs.prova && '1' || '' }}

      - name: Pubblica i dati per l'app (ramo "data")
        if: always() && hashFiles('out/idro.json') != ''
        run: |
          cd out
          git init -q -b data
          git config user.name "idrometria-bot"
          git config user.email "idrometria-bot@users.noreply.github.com"
          git add idro.json state.json
          git commit -q -m "dati $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
